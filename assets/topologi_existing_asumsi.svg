      .zonehdr { font-size: 15px; font-weight: 700; fill: #334155; letter-spacing: 0.5px; }
      .node { filter: url(#shadow); stroke-width: 2; }
      .isp { fill: #E0F2FE; stroke: #0284C7; }
      .router { fill: #EEF2FF; stroke: #4F46E5; }
      .switch { fill: #ECFDF5; stroke: #059669; }
      .hub { fill: #FFF7ED; stroke: #EA580C; }
      .ap { fill: #F5F3FF; stroke: #7C3AED; }
      .user { fill: #F8FAFC; stroke: #64748B; }
      .ok { fill: #F0FDF4; stroke: #16A34A; }
      .note { fill: #FFFBEB; stroke: #D97706; }
      .unknown { fill: #F8FAFC; stroke: #94A3B8; stroke-dasharray: 6 4; }
      .t-b { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .t { font-size: 12.5px; fill: #334155; }
      .t-s { font-size: 11.5px; fill: #64748B; }
      .cable { fill: none; stroke: #334155; stroke-width: 2.5; }
      .wifi { fill: none; stroke: #7C3AED; stroke-width: 2; stroke-dasharray: 6 5; }
      .unk { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 6 5; }
      .direct { fill: none; stroke: #16A34A; stroke-width: 2.5; stroke-dasharray: 8 5; }
      .pill { fill: #FFFFFF; stroke: #4F46E5; stroke-width: 1.5; }
      .pill-t { font-size: 12px; font-weight: 600; fill: #3730A3; }
      .badge { fill: #DC2626; }
      .badge-t { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .mk { fill: #0F172A; }
      .mk-t { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    </style>
