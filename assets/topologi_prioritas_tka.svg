<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0F172A; }
      .subtitle { font-size: 14px; fill: #475569; }
      .zone-tka { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2; stroke-dasharray: 8 5; }
      .zone-gen { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .zonehdr-tka { font-size: 15px; font-weight: 800; fill: #1D4ED8; letter-spacing: 0.5px; }
      .zonehdr-gen { font-size: 15px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .node { filter: url(#shadow); stroke-width: 2; }
      .isp { fill: #E0F2FE; stroke: #0284C7; }
      .router-core { fill: #EEF2FF; stroke: #4F46E5; }
      .router-tka { fill: #EFF6FF; stroke: #2563EB; stroke-width: 2.5; }
      .switch-gigabit { fill: #ECFDF5; stroke: #059669; }
      .ap { fill: #F5F3FF; stroke: #7C3AED; }
      .user { fill: #FFFFFF; stroke: #64748B; }
      .tka-pc { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
      .proktor { fill: #FEF3C7; stroke: #D97706; stroke-width: 2; }
      .pill-tka { fill: #DBEAFE; stroke: #2563EB; stroke-width: 1.5; }
      .pill-tka-t { font-size: 12px; font-weight: 700; fill: #1E40AF; }
      .pill-gen { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.5; }
      .pill-gen-t { font-size: 12px; font-weight: 600; fill: #475569; }
      .t-b { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .t { font-size: 12.5px; fill: #334155; }
      .t-s { font-size: 11.5px; fill: #64748B; }
      .cable-tka { fill: none; stroke: #2563EB; stroke-width: 3.5; }
      .cable-gen { fill: none; stroke: #64748B; stroke-width: 2; stroke-dasharray: 5 4; }
      .wifi { fill: none; stroke: #9333EA; stroke-width: 2; stroke-dasharray: 6 5; }
      .badge-ok { fill: #16A34A; }
      .badge-ok-t { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
      .badge-p1 { fill: #DC2626; }
      .badge-p1-t { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>

  <!-- Title Section -->
  <text x="40" y="46" class="title">Rancangan Topologi Khusus Prioritas TKA ("TKA-First Architecture")</text>
  <text x="40" y="72" class="subtitle">Strategi Mitigasi Beban 84 PC: Isolasi Jalur Lab TKA menggunakan Router #2 &amp; Switch Gigabit 16-Port (Zero-Cost Optimization)</text>
  
  <rect x="1350" y="24" width="210" height="36" rx="18" fill="#DC2626" filter="url(#shadow)"/>
  <text x="1455" y="47" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">★ TKA PRIORITY MODE</text>

  <!-- ===================== ZONES ===================== -->
  <!-- ZONE 1: TKA DEDICATED (LEFT / CENTER - DOMINANT) -->
  <rect x="40" y="520" width="1020" height="470" rx="16" class="zone-tka"/>
  <rect x="52" y="530" width="410" height="28" fill="#FFFFFF"/>
  <text x="60" y="550" class="zonehdr-tka">ZONA PRIORITAS 1 — LAB TKA (TJKT &amp; MP) — 80–84 PC</text>

  <!-- ZONE 2: NON-TKA TRAFFIC (RIGHT - RESTRICTED) -->
  <rect x="1080" y="520" width="480" height="470" rx="16" class="zone-gen"/>
  <rect x="1092" y="530" width="370" height="28" fill="#FFFFFF"/>
  <text x="1100" y="550" class="zonehdr-gen">ZONA NON-TKA (RUANG GURU &amp; SELASAR)</text>

  <!-- ===================== CORE & ISP NODES ===================== -->
  <!-- Internet -->
  <ellipse cx="800" cy="115" rx="90" ry="28" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="120" text-anchor="middle" class="t-b">☁ INTERNET (CBT PUSAT)</text>

  <!-- ONT ISP -->
  <rect x="680" y="165" width="240" height="54" rx="10" class="node isp"/>
  <text x="800" y="188" text-anchor="middle" class="t-b">ONT / Modem ISP</text>
  <text x="800" y="207" text-anchor="middle" class="t">Fibernet 100 Mbps Dedicated</text>

  <!-- Switch ISP -->
  <rect x="680" y="245" width="240" height="50" rx="10" class="node isp"/>
  <text x="800" y="266" text-anchor="middle" class="t-b">Switch ISP</text>
  <text x="800" y="284" text-anchor="middle" class="t-s">Distribusi Dual-Gateway (Jalur Utama &amp; Cadangan)</text>

  <!-- Backbone Links -->
  <path d="M800,143 V165" class="cable-tka"/>
  <path d="M800,219 V245" class="cable-tka"/>

  <!-- Split to Dual Gateway (Utilizing 2nd hAP Lite router) -->
  <!-- Left path: To Dedicated TKA Router (or Dedicated Port) -->
  <path d="M730,295 V340 H450 V370" class="cable-tka"/>
  <!-- Right path: To General Router -->
  <path d="M870,295 V340 H1200 V370" class="cable-gen"/>

  <!-- NODE: ROUTER #2 (DEDICATED FOR TKA EXAM LABS) -->
  <rect x="290" y="370" width="320" height="110" rx="12" class="node router-tka"/>
  <rect x="525" y="358" width="75" height="22" rx="11" class="badge-p1"/>
  <text x="562" y="373" text-anchor="middle" class="badge-p1-t">PRIORITY 1</text>
  <text x="450" y="396" text-anchor="middle" class="t-b">Router #2 — Gateway Khusus TKA</text>
  <text x="450" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#1D4ED8">MikroTik hAP lite #2 (Memanfaatkan Aset Idle)</text>
  <text x="450" y="435" text-anchor="middle" class="t-s">Fokus: 100% Resource CPU/RAM untuk 84 PC Ujian</text>
  <text x="450" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">Queue: Jaminan 75–80 Mbps CIR (Limit-at)</text>

  <!-- NODE: ROUTER #1 (GENERAL SERVICES: GURU, BYOD, SELASAR) -->
  <rect x="1050" y="370" width="300" height="110" rx="12" class="node router-core"/>
  <text x="1200" y="396" text-anchor="middle" class="t-b">Router #1 — Gateway Umum &amp; Hotspot</text>
  <text x="1200" y="416" text-anchor="middle" class="t">MikroTik hAP lite #1 (Operasional Sekolah)</text>
  <text x="1200" y="435" text-anchor="middle" class="t-s">DHCP Hotspot Siswa • Ruang Guru • Selasar</text>
  <text x="1200" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">Queue TKA Mode: Dibatasi Max 20 Mbps</text>

  <!-- Downlinks from TKA Router -->
  <path d="M380,480 V580" class="cable-tka"/>
  <path d="M520,480 V580" class="cable-tka"/>

  <!-- TKA LAB NODES -->
  <!-- Switch Lab TJKT -->
  <rect x="250" y="580" width="260" height="75" rx="10" class="node switch-gigabit"/>
  <rect x="420" y="568" width="80" height="20" rx="10" class="badge-ok"/><text x="460" y="582" text-anchor="middle" class="badge-ok-t">1000 Mbps</text>
  <text x="380" y="605" text-anchor="middle" class="t-b">Switch 16 Port Gigabit (Lab 1)</text>
  <text x="380" y="624" text-anchor="middle" class="t">TP-Link 16p 100/1000 (Unit 1 &amp; 2)</text>
  <text x="380" y="642" text-anchor="middle" class="t-s">Subnet: 192.168.20.0/24 (Lab TJKT)</text>

  <!-- Switch Lab MP -->
  <rect x="540" y="580" width="260" height="75" rx="10" class="node switch-gigabit"/>
  <rect x="710" y="568" width="80" height="20" rx="10" class="badge-ok"/><text x="750" y="582" text-anchor="middle" class="badge-ok-t">1000 Mbps</text>
  <text x="670" y="605" text-anchor="middle" class="t-b">Switch 16 Port Gigabit (Lab 2)</text>
  <text x="670" y="624" text-anchor="middle" class="t">TP-Link 16p 100/1000 (Unit 3 &amp; 4)</text>
  <text x="670" y="642" text-anchor="middle" class="t-s">Subnet: 192.168.21.0/24 (Lab MP)</text>

  <!-- Server Proktor / Cadangan -->
  <rect x="830" y="580" width="210" height="75" rx="10" class="node proktor"/>
  <text x="935" y="605" text-anchor="middle" class="t-b">Server Proktor TKA</text>
  <text x="935" y="624" text-anchor="middle" class="t">Mode Semi-Online / Sync</text>
  <text x="935" y="642" text-anchor="middle" class="t-s">+ Modem 4G Backup Emergency</text>

  <!-- Links from switches to endpoints -->
  <path d="M380,655 V710 H180 V740" class="cable-tka"/>
  <path d="M380,710 H380 V740" class="cable-tka"/>
  <path d="M670,655 V710 H570 V740" class="cable-tka"/>
  <path d="M670,710 H770 V740" class="cable-tka"/>
  <path d="M935,655 V740" class="cable-tka"/>

  <!-- Endpoints Lab TJKT -->
  <rect x="100" y="740" width="160" height="90" rx="10" class="node tka-pc"/>
  <text x="180" y="768" text-anchor="middle" class="t-b">PC Klien Lab TJKT</text>
  <text x="180" y="788" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">Unit 01 – 21</text>
  <text x="180" y="806" text-anchor="middle" class="t-s">Kabel UTP Cat5e Gigabit</text>
  <text x="180" y="822" text-anchor="middle" class="t-s">Update OS Disabled</text>

  <rect x="300" y="740" width="160" height="90" rx="10" class="node tka-pc"/>
  <text x="380" y="768" text-anchor="middle" class="t-b">PC Klien Lab TJKT</text>
  <text x="380" y="788" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">Unit 22 – 42</text>
  <text x="380" y="806" text-anchor="middle" class="t-s">Kabel UTP Cat5e Gigabit</text>
  <text x="380" y="822" text-anchor="middle" class="t-s">Update OS Disabled</text>

  <!-- Endpoints Lab MP -->
  <rect x="490" y="740" width="160" height="90" rx="10" class="node tka-pc"/>
  <text x="570" y="768" text-anchor="middle" class="t-b">PC Klien Lab MP</text>
  <text x="570" y="788" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">Unit 01 – 20</text>
  <text x="570" y="806" text-anchor="middle" class="t-s">Kabel UTP Cat5e Gigabit</text>
  <text x="570" y="822" text-anchor="middle" class="t-s">Update OS Disabled</text>

  <rect x="690" y="740" width="160" height="90" rx="10" class="node tka-pc"/>
  <text x="770" y="768" text-anchor="middle" class="t-b">PC Klien Lab MP</text>
  <text x="770" y="788" text-anchor="middle" font-size="12" font-weight="700" fill="#2563EB">Unit 21 – 40</text>
  <text x="770" y="806" text-anchor="middle" class="t-s">Kabel UTP Cat5e Gigabit</text>
  <text x="770" y="822" text-anchor="middle" class="t-s">Update OS Disabled</text>

  <!-- PC Proktor / Pengawas -->
  <rect x="880" y="740" width="160" height="90" rx="10" class="node proktor"/>
  <text x="960" y="768" text-anchor="middle" class="t-b">PC Proktor / Uji</text>
  <text x="960" y="788" text-anchor="middle" font-size="12" font-weight="700" fill="#B45309">Monitoring CBT</text>
  <text x="960" y="806" text-anchor="middle" class="t-s">Dashboard Status Klien</text>
  <text x="960" y="822" text-anchor="middle" class="t-s">Ping Latency &lt; 5ms</text>

  <!-- TKA Action Pills at Bottom of Zone 1 -->
  <rect x="100" y="860" width="910" height="105" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="120" y="885" font-size="13.5" font-weight="800" fill="#1E40AF">🛡 SOP PENGAMANAN JALUR TKA SAAT UJIAN BERLANGSUNG:</text>
  <text x="120" y="908" class="t">• <tspan font-weight="700">Zero Hub:</tspan> Seluruh Hub 8 port TP-Link/Tenda disingkirkan dari Lab, digantikan Switch 16-Port Gigabit TP-Link (Aset Sekolah).</text>
  <text x="120" y="928" class="t">• <tspan font-weight="700">Dedicated Subnet:</tspan> Lab TJKT (192.168.20.0/24) dan Lab MP (192.168.21.0/24) terisolasi penuh dari broadcast domain WiFi siswa.</text>
  <text x="120" y="948" class="t">• <tspan font-weight="700">Bandwidth Lock:</tspan> Router menjamin 80 Mbps reserved untuk CBT. Latensi dijaga &lt; 15 ms, jitter &lt; 5 ms ke server pusat.</text>

  <!-- ===================== ZONE 2 NODES: NON-TKA ===================== -->
  <path d="M1200,480 V580" class="cable-gen"/>
  <path d="M1200,580 H1160 V610" class="cable-gen"/>
  <path d="M1200,580 H1380 V610" class="cable-gen"/>

  <!-- Switch Ruang Guru -->
  <rect x="1100" y="610" width="160" height="65" rx="10" class="node user"/>
  <text x="1180" y="635" text-anchor="middle" class="t-b">Switch R. Guru</text>
  <text x="1180" y="654" text-anchor="middle" class="t-s">Queue Limit: 10 Mbps</text>

  <!-- Switch Selasar / Tamu -->
  <rect x="1300" y="610" width="160" height="65" rx="10" class="node user"/>
  <text x="1380" y="635" text-anchor="middle" class="t-b">AP Selasar / Siswa</text>
  <text x="1380" y="654" text-anchor="middle" class="t-s">Queue Limit: 10 Mbps</text>

  <path d="M1180,675 V730" class="cable-gen"/>
  <path d="M1380,675 V730" class="wifi"/>

  <rect x="1100" y="730" width="160" height="75" rx="10" class="node user"/>
  <text x="1180" y="756" text-anchor="middle" class="t-b">Guru &amp; Administrasi</text>
  <text x="1180" y="775" text-anchor="middle" class="t-s">Dapodik / e-Rapor</text>
  <text x="1180" y="792" text-anchor="middle" class="t-s">Akses tetap lancar</text>

  <rect x="1300" y="730" width="160" height="75" rx="10" class="node user"/>
  <text x="1380" y="756" text-anchor="middle" class="t-b">BYOD Siswa / Tamu</text>
  <text x="1380" y="775" text-anchor="middle" class="t-s">WiFi dibatasi / captive</text>
  <text x="1380" y="792" text-anchor="middle" font-size="11" font-weight="700" fill="#DC2626">Non-Priority saat TKA</text>

  <rect x="1100" y="830" width="360" height="135" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1120" y="855" font-size="13" font-weight="800" fill="#B91C1C">⚡ ISOLASI TRAFIK NON-TKA:</text>
  <text x="1120" y="878" class="t">• SSID Siswa disembunyikan/dimatikan saat sesi</text>
  <text x="1120" y="896" class="t">  ujian berlangsung untuk mencegah interferensi AP.</text>
  <text x="1120" y="916" class="t">• Total bandwidth non-TKA dibatasi ketat max 20 Mbps</text>
  <text x="1120" y="936" class="t">  sehingga tidak ada perebutan paket dengan Lab CBT.</text>
  <text x="1120" y="954" class="t">• Ruang Guru tetap dapat bekerja tanpa gangguan.</text>

  <!-- ===================== BOTTOM SUMMARY TABLE ===================== -->
  <rect x="40" y="1010" width="1520" height="160" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="1038" class="title" font-size="17">Perbandingan: Kondisi Existing vs Solusi Prioritas TKA</text>

  <line x1="60" y1="1052" x2="1540" y2="1052" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="60" y="1076" class="t-b" fill="#B91C1C">Parameter</text>
  <text x="280" y="1076" class="t-b" fill="#64748B">Kondisi Existing (Rawan Gagal saat TKA)</text>
  <text x="760" y="1076" class="t-b" fill="#1D4ED8">Solusi TKA-First (Direkomendasikan)</text>
  <text x="1260" y="1076" class="t-b" fill="#059669">Manfaat untuk Sekolah</text>

  <text x="60" y="1102" class="t-b">Beban Gateway</text>
  <text x="280" y="1102" class="t">1 router hAP lite memikul seluruh sekolah + 84 PC</text>
  <text x="760" y="1102" class="t"><tspan font-weight="700">Dedicated Router #2</tspan> khusus Lab (manfaatkan aset idle)</text>
  <text x="1260" y="1102" class="t" fill="#15803D">CPU router &lt; 35%, bebas crash saat ujian</text>

  <text x="60" y="1126" class="t-b">Switch Lab</text>
  <text x="280" y="1126" class="t">Bercampur dengan Hub 8-port (Collision domain tinggi)</text>
  <text x="760" y="1126" class="t"><tspan font-weight="700">Switch 16 Port Gigabit TP-Link</tspan> dedicated ke PC Lab</text>
  <text x="1260" y="1126" class="t" fill="#15803D">Throughput LAN 1000 Mbps, zero packet loss</text>

  <text x="60" y="1150" class="t-b">Jaminan Bandwidth</text>
  <text x="280" y="1150" class="t">Lab berbagi di Queue Atas 50 Mbps dengan WiFi siswa</text>
  <text x="760" y="1150" class="t"><tspan font-weight="700">CIR 75–80 Mbps Dedicated</tspan> untuk TKA (Priority 1)</text>
  <text x="1260" y="1150" class="t" fill="#15803D">Tidak terganggu aktivitas browsing/streaming luar</text>
</svg>
